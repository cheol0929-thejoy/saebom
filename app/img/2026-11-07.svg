<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="연기 가득한 성전 안 높이 들린 보좌에서 빛이 내리고, 제단 위 핀 숯이 부젓가락에 집혀 빛난다">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2117"/>
      <stop offset="0.45" stop-color="#4A3A28"/>
      <stop offset="1" stop-color="#2E2419"/>
    </linearGradient>
    <radialGradient id="glory" cx="600" cy="40" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF3C8" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#F2D79A" stop-opacity="0.45"/>
      <stop offset="0.75" stop-color="#C9A86A" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#C9A86A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF1C2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFF1C2" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="coal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF4D0"/>
      <stop offset="0.35" stop-color="#FFB84D"/>
      <stop offset="0.7" stop-color="#E0552A"/>
      <stop offset="1" stop-color="#7A2A14"/>
    </radialGradient>
    <radialGradient id="coalglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC56B" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#F28A3D" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#F28A3D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E7A5C"/>
      <stop offset="1" stop-color="#5A4A35"/>
    </linearGradient>
    <linearGradient id="stoneTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A08A66"/>
      <stop offset="0.5" stop-color="#C4AA7E"/>
      <stop offset="1" stop-color="#A08A66"/>
    </linearGradient>
    <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B2F22"/>
      <stop offset="0.45" stop-color="#7B6648"/>
      <stop offset="1" stop-color="#3B2F22"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B4A34"/>
      <stop offset="1" stop-color="#2B2117"/>
    </linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6D8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F3DCA8" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="smoke" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>

  <!-- 성전 안 어둑한 배경 -->
  <rect width="1200" height="675" fill="url(#sky)"/>

  <!-- 바닥 -->
  <rect x="0" y="470" width="1200" height="205" fill="url(#floor)"/>
  <path d="M0 470 L1200 470" stroke="#7A6549" stroke-width="2" opacity="0.6"/>
  <path d="M0 520 L1200 520 M0 580 L1200 580 M0 640 L1200 640" stroke="#1F1810" stroke-width="2" opacity="0.5"/>

  <!-- 양쪽 기둥 -->
  <g>
    <rect x="60" y="80" width="90" height="400" fill="url(#pillar)"/>
    <rect x="40" y="60" width="130" height="30" rx="4" fill="#6A5640"/>
    <rect x="40" y="470" width="130" height="24" rx="3" fill="#4C3C2B"/>
    <rect x="1050" y="80" width="90" height="400" fill="url(#pillar)"/>
    <rect x="1030" y="60" width="130" height="30" rx="4" fill="#6A5640"/>
    <rect x="1030" y="470" width="130" height="24" rx="3" fill="#4C3C2B"/>
    <rect x="230" y="140" width="56" height="340" fill="url(#pillar)" opacity="0.75"/>
    <rect x="214" y="124" width="88" height="22" rx="3" fill="#5E4B37" opacity="0.8"/>
    <rect x="914" y="140" width="56" height="340" fill="url(#pillar)" opacity="0.75"/>
    <rect x="898" y="124" width="88" height="22" rx="3" fill="#5E4B37" opacity="0.8"/>
  </g>

  <!-- 높이 들린 보좌의 영광 (위에서 내리는 빛) -->
  <ellipse cx="600" cy="30" rx="560" ry="300" fill="url(#glory)"/>
  <path d="M470 0 L730 0 L900 480 L300 480 Z" fill="url(#beam)"/>
  <!-- 성전에 가득한 옷자락 -->
  <path d="M520 0 C500 120 430 200 300 300 C250 340 240 420 240 480 L960 480 C960 420 950 340 900 300 C770 200 700 120 680 0 Z" fill="url(#robe)" opacity="0.55"/>

  <!-- 성전에 가득한 연기 -->
  <g filter="url(#smoke)" opacity="0.55">
    <ellipse cx="260" cy="250" rx="220" ry="90" fill="#D9C6A2"/>
    <ellipse cx="930" cy="230" rx="240" ry="95" fill="#D9C6A2"/>
    <ellipse cx="420" cy="140" rx="200" ry="70" fill="#E8D7B2"/>
    <ellipse cx="820" cy="120" rx="210" ry="75" fill="#E8D7B2"/>
    <ellipse cx="600" cy="330" rx="330" ry="60" fill="#CDB68F" opacity="0.6"/>
  </g>
  <g filter="url(#soft)" opacity="0.35">
    <ellipse cx="150" cy="420" rx="200" ry="70" fill="#BFA880"/>
    <ellipse cx="1050" cy="430" rx="200" ry="70" fill="#BFA880"/>
  </g>

  <!-- 제단 -->
  <g>
    <path d="M430 540 L770 540 L800 630 L400 630 Z" fill="url(#stone)"/>
    <rect x="440" y="500" width="320" height="44" rx="6" fill="url(#stoneTop)"/>
    <path d="M460 500 L740 500 L730 482 L470 482 Z" fill="#B49A70"/>
    <!-- 제단 네 뿔 -->
    <path d="M444 500 L456 470 L470 500 Z" fill="#C9B086"/>
    <path d="M730 500 L744 470 L756 500 Z" fill="#C9B086"/>
    <!-- 돌 이음새 -->
    <path d="M520 544 L515 630 M680 544 L690 630 M600 544 L600 630" stroke="#3E3224" stroke-width="2" opacity="0.6"/>
    <path d="M415 588 L785 588" stroke="#3E3224" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- 제단 위 불씨들 -->
  <g>
    <ellipse cx="600" cy="486" rx="150" ry="22" fill="url(#coalglow)" filter="url(#soft2)"/>
    <ellipse cx="530" cy="486" rx="26" ry="11" fill="#8A3418"/>
    <ellipse cx="560" cy="490" rx="22" ry="9" fill="#B5471E"/>
    <ellipse cx="650" cy="488" rx="28" ry="11" fill="#8A3418"/>
    <ellipse cx="680" cy="484" rx="20" ry="8" fill="#A64222"/>
    <ellipse cx="610" cy="492" rx="24" ry="9" fill="#C25A24"/>
  </g>

  <!-- 부젓가락에 집힌 핀 숯 (가운데) -->
  <g>
    <circle cx="600" cy="372" r="120" fill="url(#coalglow)" filter="url(#soft)"/>
    <!-- 부젓가락: 아래 손잡이에서 두 팔이 벌어져 숯을 양쪽에서 집는다 -->
    <path d="M600 478 L556 372" fill="none" stroke="#6B5A47" stroke-width="8" stroke-linecap="round"/>
    <path d="M600 478 L644 372" fill="none" stroke="#6B5A47" stroke-width="8" stroke-linecap="round"/>
    <path d="M598 440 L602 440" stroke="#8C785F" stroke-width="10" stroke-linecap="round"/>
    <circle cx="600" cy="478" r="8" fill="#8C785F"/>
    <!-- 핀 숯 -->
    <path d="M600 322 C628 318 652 342 648 370 C644 398 618 410 598 404 C572 398 552 376 560 350 C566 332 582 324 600 322 Z" fill="url(#coal)"/>
    <path d="M580 348 C590 342 606 344 614 352" fill="none" stroke="#FFF0C0" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M588 380 C598 388 616 386 626 376" fill="none" stroke="#FFD27A" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <!-- 부젓가락 집게 끝 (숯 위로 보이게) -->
    <path d="M556 372 C548 352 556 334 572 326" fill="none" stroke="#6B5A47" stroke-width="8" stroke-linecap="round"/>
    <path d="M644 372 C652 352 644 334 628 326" fill="none" stroke="#6B5A47" stroke-width="8" stroke-linecap="round"/>
    <!-- 작은 불티 -->
    <circle cx="560" cy="300" r="3" fill="#FFD27A" opacity="0.8"/>
    <circle cx="640" cy="290" r="2.5" fill="#FFC56B" opacity="0.7"/>
    <circle cx="622" cy="258" r="2" fill="#FFE39C" opacity="0.7"/>
    <circle cx="575" cy="270" r="2" fill="#FFE39C" opacity="0.6"/>
  </g>

  <!-- 흔들리는 문지방 느낌의 빛 -->
  <ellipse cx="600" cy="630" rx="330" ry="26" fill="#F5C971" opacity="0.12" filter="url(#soft2)"/>
</svg>
