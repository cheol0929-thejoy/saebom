  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d6b6a"/>
      <stop offset="0.45" stop-color="#c9b08a"/>
      <stop offset="0.75" stop-color="#f1dcb0"/>
      <stop offset="1" stop-color="#f6e7c6"/>
    </linearGradient>
    <radialGradient id="sun" cx="600" cy="402" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff6dc" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#fbe7b8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f6e7c6" stop-opacity="0"/>
