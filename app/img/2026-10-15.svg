<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="나무 기둥에 못 박힌 빚 문서 두루마리, 적힌 줄마다 지워져 있다">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6F0E4"/><stop offset="1" stop-color="#E7DAC3"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.05" r="0.75"><stop offset="0" stop-color="#FFF8E6" stop-opacity="1"/><stop offset="1" stop-color="#FFF8E6" stop-opacity="0"/></radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6F4A2E"/><stop offset="0.4" stop-color="#9A6B44"/><stop offset="0.7" stop-color="#8A5E3B"/><stop offset="1" stop-color="#5E3E26"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBF5E6"/><stop offset="1" stop-color="#E8D9B8"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <g fill="#FFFBEF" opacity="0.35"><polygon points="520,0 680,0 820,675 380,675"/></g>
  <!-- beam -->
  <rect x="510" y="0" width="180" height="675" fill="url(#wood)"/>
  <g fill="none" stroke="#5A3B24" stroke-width="2" opacity="0.5">
    <path d="M540 0 C 545 200, 535 400, 545 675"/><path d="M600 0 C 595 220, 610 420, 598 675"/><path d="M655 0 C 660 180, 650 450, 660 675"/>
  </g>
  <!-- scroll -->
  <g transform="rotate(-3 600 360)">
    <rect x="430" y="190" width="340" height="360" rx="6" fill="url(#paper)" stroke="#C9B48A" stroke-width="2"/>
    <rect x="418" y="176" width="364" height="26" rx="13" fill="#D9C49A" stroke="#B89E6E" stroke-width="2"/>
    <rect x="418" y="538" width="364" height="26" rx="13" fill="#D9C49A" stroke="#B89E6E" stroke-width="2"/>
    <g stroke="#9C8A6A" stroke-width="5" stroke-linecap="round" opacity="0.7">
      <line x1="470" y1="250" x2="730" y2="250"/><line x1="470" y1="290" x2="700" y2="290"/><line x1="470" y1="330" x2="720" y2="330"/>
      <line x1="470" y1="370" x2="690" y2="370"/><line x1="470" y1="410" x2="725" y2="410"/><line x1="470" y1="450" x2="660" y2="450"/>
      <line x1="470" y1="490" x2="610" y2="490"/>
    </g>
    <!-- cancelled -->
    <g stroke="#9E3B2E" stroke-width="9" stroke-linecap="round" opacity="0.85">
      <line x1="460" y1="230" x2="740" y2="510"/><line x1="740" y1="230" x2="460" y2="510"/>
    </g>
  </g>
  <!-- nail -->
  <circle cx="600" cy="214" r="16" fill="#4A4A4A"/><circle cx="596" cy="210" r="6" fill="#8C8C8C"/>
  <path d="M580 222 C 590 232, 610 232, 620 222" fill="none" stroke="#3A3A3A" stroke-width="3" opacity="0.5"/>
</svg>
