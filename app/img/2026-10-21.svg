<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="새벽빛이 밝아 오는 지평선을 향해 장막 앞에서 길 하나가 멀리 이어져 있다">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E4E6E"/>
      <stop offset="0.45" stop-color="#9A8FA0"/>
      <stop offset="0.75" stop-color="#E9C49A"/>
      <stop offset="1" stop-color="#F6E3C2"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.72" cy="0.6" r="0.35">
      <stop offset="0" stop-color="#FFF4DA" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#FCE2B0" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FCE2B0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B99A6E"/>
      <stop offset="1" stop-color="#8A6C47"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E8D3AE"/>
      <stop offset="1" stop-color="#F7E8CC"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#sky)"/>
  <rect width="1200" height="675" fill="url(#sun)"/>
  <g fill="#FFFFFF">
    <circle cx="140" cy="70" r="2.2" opacity="0.9"/><circle cx="260" cy="130" r="1.6" opacity="0.7"/>
    <circle cx="380" cy="55" r="1.8" opacity="0.8"/><circle cx="520" cy="110" r="1.4" opacity="0.6"/>
    <circle cx="90" cy="180" r="1.5" opacity="0.6"/><circle cx="640" cy="45" r="1.6" opacity="0.6"/>
    <circle cx="300" cy="210" r="1.2" opacity="0.45"/><circle cx="460" cy="190" r="1.3" opacity="0.4"/>
    <circle cx="780" cy="80" r="1.2" opacity="0.4"/><circle cx="1020" cy="60" r="1.1" opacity="0.35"/>
  </g>
  <circle cx="864" cy="405" r="34" fill="#FFF6E0" opacity="0.95"/>
  <!-- far hills -->
  <path d="M0 410 C 160 380, 300 395, 460 385 C 640 372, 760 398, 900 392 C 1020 386, 1110 378, 1200 388 L1200 675 L0 675 Z" fill="#A98F8A" opacity="0.55"/>
  <path d="M0 430 C 200 412, 380 425, 560 418 C 760 410, 960 428, 1200 420 L1200 675 L0 675 Z" fill="url(#land)"/>
  <!-- road winding to horizon -->
  <path d="M470 675 C 520 600, 640 560, 700 520 C 760 482, 820 450, 858 424 L866 424 C 836 452, 790 486, 742 524 C 690 566, 640 610, 640 675 Z" fill="url(#road)" opacity="0.9"/>
  <!-- tent on the left -->
  <g>
    <path d="M150 540 L270 430 L390 540 Z" fill="#6E4F33"/>
    <path d="M270 430 L300 540 L240 540 Z" fill="#3F2C1C"/>
    <path d="M150 540 L270 430 L230 540 Z" fill="#87633F" opacity="0.6"/>
    <line x1="270" y1="430" x2="270" y2="412" stroke="#3F2C1C" stroke-width="4"/>
    <line x1="150" y1="540" x2="120" y2="556" stroke="#3F2C1C" stroke-width="2"/>
    <line x1="390" y1="540" x2="420" y2="556" stroke="#3F2C1C" stroke-width="2"/>
  </g>
  <!-- small shrubs -->
  <g fill="#6B5A3A" opacity="0.8">
    <ellipse cx="560" cy="470" rx="20" ry="8"/><ellipse cx="1000" cy="455" rx="26" ry="9"/>
    <ellipse cx="90" cy="600" rx="34" ry="11"/><ellipse cx="1080" cy="560" rx="40" ry="12"/>
  </g>
  <!-- footprints on the road -->
  <g fill="#C9AF84" opacity="0.8">
    <ellipse cx="560" cy="640" rx="7" ry="11" transform="rotate(-30 560 640)"/>
    <ellipse cx="590" cy="612" rx="6" ry="10" transform="rotate(-32 590 612)"/>
    <ellipse cx="625" cy="588" rx="5.5" ry="9" transform="rotate(-34 625 588)"/>
    <ellipse cx="655" cy="566" rx="5" ry="8" transform="rotate(-36 655 566)"/>
    <ellipse cx="686" cy="545" rx="4.5" ry="7" transform="rotate(-38 686 545)"/>
  </g>
</svg>
