<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>새봄묵상</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: single reading column like a printed devotional booklet; date strip on top, audio card, then 본문→관찰→해석→적용→기도, archive list at the end */
:root{
  --bg:#000000; --paper:#121212; --ink:#ECEDEA; --muted:#A4AAA4; --line:#2A2D2A;
  --leaf:#8DBE97; --leaf-soft:#1A221C; --gold:#D3B370;
  color-scheme:dark;
  --serif:"Gowun Batang","Noto Serif KR",serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --fs:19px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --paper:#121212; --ink:#ECEDEA; --muted:#A4AAA4; --line:#2A2D2A;
  --leaf:#8DBE97; --leaf-soft:#1A221C; --gold:#D3B370; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --paper:#121212; --ink:#ECEDEA; --muted:#A4AAA4; --line:#2A2D2A;
  --leaf:#8DBE97; --leaf-soft:#1A221C; --gold:#D3B370; color-scheme:dark}
html{font-size:var(--fs)}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brandrow{display:flex;align-items:center;gap:.55em}
.mark{height:2.6em;width:auto;max-width:none;flex:none;display:block}
.brand{font-family:var(--serif);font-weight:700;color:var(--leaf);font-size:1.05rem;letter-spacing:.02em}
.brand small{display:block;font-family:var(--sans);font-weight:400;color:var(--muted);font-size:.72rem;letter-spacing:.04em}
.sizer{display:flex;gap:6px}
.sizer button{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;min-height:40px}
.sizer button:focus-visible,.play:focus-visible,.arch a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-block:6px 4px}
.date{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
h1{font-family:var(--serif);font-weight:700;font-size:2.1rem;line-height:1.3;margin:0;text-wrap:balance}
.ref{color:var(--leaf);font-weight:500;font-size:.95rem}
.tts{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:2px auto 0}
@media (max-width:460px){.tts .lab{display:none}.tts{gap:6px}}
.tts .lab{font-size:.9rem;color:var(--muted)}
.tts .pp{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--leaf);color:var(--paper);font-size:1.1rem;cursor:pointer;display:grid;place-items:center}
.tts .st{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:.8rem;cursor:pointer}
.tts .st:disabled{opacity:.35;cursor:default}
.tts .rate{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 8px;min-height:38px;max-width:none}
.tts .vsel{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.tts .vsel button{font:inherit;font-size:.8rem;border:0;background:transparent;color:var(--muted);padding:5px 9px;min-height:38px;cursor:pointer}
.tts .vsel button.on{background:var(--leaf);color:var(--paper);font-weight:700}
.tts .vsel button:disabled{opacity:.35;cursor:default}
.tts .vsel button:focus-visible,.tts .pp:focus-visible,.tts .st:focus-visible,.tts .rate:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{display:flex;align-items:center;gap:12px;margin:0 auto;width:100%;max-width:640px}
.bar .tm{flex:none;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar input[type=range]{flex:1;min-width:40px;accent-color:var(--leaf);height:32px}
.aiNote{color:var(--muted);font-size:.78rem;text-align:center;margin:-6px 0 0}
article{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;gap:30px}
section{display:flex;flex-direction:column;gap:8px}
h2{margin:0;font-size:.8rem;letter-spacing:.14em;color:var(--gold);font-weight:700;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
p{margin:0}
.scripture{font-family:var(--serif);font-size:1.02rem;line-height:1.7}
.scripture .v{display:block;padding-left:2.1em;text-indent:-2.1em}
.scripture sup{font-family:var(--sans);font-size:.65rem;color:var(--leaf);font-weight:700;display:inline-block;width:2.1em;text-indent:0;vertical-align:.35em}
.key{border-left:3px solid var(--leaf);padding:4px 0 4px 14px;font-family:var(--serif);font-weight:700;font-size:1.08rem}
.practice{background:var(--leaf-soft);border-radius:10px;padding:14px 16px}
.special{display:inline-block;font-size:.78rem;font-weight:700;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:2px 12px;letter-spacing:.04em}
.sub{margin:10px 0 0;font-size:1rem;font-weight:700;display:flex;align-items:center;gap:8px;word-break:keep-all}
.sub i{font-style:normal;font-size:.72rem;color:var(--bg);background:var(--leaf);border-radius:999px;padding:2px 10px}
h1,h2,.arch a .t{word-break:keep-all}
.share{background:var(--leaf-soft);border-radius:14px;padding:16px 18px;text-align:center}
.share h2{justify-content:center}
.share p{margin:0}
.share-btn{font:inherit;font-weight:700;border:1px solid var(--leaf);border-radius:999px;background:transparent;color:var(--leaf);padding:10px 20px;cursor:pointer;align-self:center}
.kakao-btn{display:block;align-self:stretch;font-weight:800;font-size:1.05rem;text-decoration:none;border-radius:14px;background:#FEE500;color:#191919;padding:15px 18px}
.kakao-btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.share-btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.share-msg{color:var(--leaf);font-size:.9rem;min-height:1.2em}
.practice b{color:var(--leaf);display:block;font-size:.85rem;margin-bottom:4px}
.prayer p{font-family:var(--serif)}
ol.req{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px}
.verse{text-align:center;font-family:var(--serif);font-size:1.12rem;line-height:1.65;padding:8px 4px}
.verse cite{display:block;font-style:normal;font-family:var(--sans);color:var(--muted);font-size:.8rem;margin-top:6px}
.arch{display:flex;flex-direction:column;gap:10px}
.arch h3{margin:0;font-size:.95rem}
.arch ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.arch li{border-bottom:1px solid var(--line)}
.arch a{display:flex;gap:14px;align-items:baseline;padding:12px 4px;color:var(--ink);text-decoration:none}
.arch a .d{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums;min-width:4.6em}
.arch a[aria-current="true"]{color:var(--leaf);font-weight:700}
.arch a .t{flex:1;min-width:0}
.arch a .r{display:block;color:var(--muted);font-size:.8rem;font-weight:400;margin-top:2px}
.arch a .ear{color:var(--leaf);font-size:.8rem;white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tabs button{font:inherit;font-size:.9rem;font-weight:700;min-height:48px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--paper)}
.tabs button:focus-visible,.arch summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.grp{display:flex;flex-direction:column;gap:4px}
.grp h4{margin:12px 0 2px;font-size:.8rem;letter-spacing:.12em;color:var(--gold)}
.arch details{border-bottom:1px solid var(--line)}
.arch details:first-of-type{border-top:1px solid var(--line)}
.arch summary{cursor:pointer;padding:13px 4px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px}
.arch summary::-webkit-details-marker{display:none}
.arch summary::after{content:"펼치기";font-weight:400;font-size:.75rem;color:var(--muted)}
.arch details[open] summary::after{content:"접기"}
.arch summary .n{color:var(--muted);font-weight:400}
.arch details ul{border-top:1px dashed var(--line);margin-bottom:8px;padding-left:10px}
.arch .empty{color:var(--muted);font-size:.85rem;margin:6px 0}
strong{font-weight:700;color:var(--ink)}
.verse strong,.key strong{color:inherit}
.pic{margin:0;display:flex;flex-direction:column;gap:8px}
.pic img{width:100%;height:auto;border-radius:12px;display:block;background:var(--leaf-soft)}
.pic figcaption{text-align:center;color:var(--muted);font-size:.78rem}
footer{color:var(--muted);font-size:.75rem;text-align:center}
@media (max-width:480px){h1{font-size:1.75rem}article{padding:22px 16px}}
/* ===== v2.0.2 owner 05:09 (via CEO): all player controls in ONE row (play · stop · speed · voices), never wraps. Speed select: fixed compact width (91u) that still shows the longest label 조금 빠르게 in full.
   Every size is a multiple of one unit --u = min(1px, row width / natural row width 338 px), so a narrow phone scales the whole row
   proportionally; label fonts are px*u (not rem) so 글자 크게 cannot push the row past the screen. Seek bar + time stay on the line below. ===== */
.tts{--u:min(1px,calc((100vw - 32px) / 338));flex-wrap:nowrap;gap:calc(2 * var(--u));max-width:100%}
@media (max-width:480px){.tts .lab{display:none}}
.tts .pp{width:calc(56 * var(--u));height:calc(56 * var(--u));font-size:calc(19 * var(--u))}
.tts .st{width:calc(40 * var(--u));height:calc(40 * var(--u));font-size:calc(13 * var(--u));padding:0}
.tts .rate{flex:none;box-sizing:border-box;width:calc(91 * var(--u));-webkit-appearance:none;appearance:none;font-size:calc(13 * var(--u));line-height:1.2;min-height:0;height:calc(40 * var(--u));padding:0 calc(15 * var(--u)) 0 calc(7 * var(--u));background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 10.5 * var(--u)) 54%,calc(100% - 6.5 * var(--u)) 54%;background-size:calc(4 * var(--u)) calc(4 * var(--u));background-repeat:no-repeat}
.tts .vsel button{font-size:calc(13 * var(--u));line-height:1.2;min-height:0;min-width:calc(40 * var(--u));height:calc(40 * var(--u));padding:0 calc(4 * var(--u))}
</style>
</head>

<script>
/* 묵상 데이터: 새 날짜는 맨 위에 추가. audio에 파일 경로(예: "audio/2026-10-15.mp3")를 넣으면 재생기가 나타남 */
let ENTRIES=[];const FB={},FULL={},PEND={};let RTOK=0,PENDING=null;
/* 새 페이지(2026-11-20): 자료는 data/ 의 JSON(자료 약속 v2). 처음엔 index.json + 보이는 날 하나만 읽고, 다른 날은 열 때 읽는다(앞뒤 하루만 미리).
   음성은 saebom-audio, 재생 실패하면 아티팩트 주소로 한 번 바꾼다 */
function adapt(d){const F={p:"audio",f:"audio_f",m:"audio_m"};(d.voices||[]).forEach(v=>{const f=F[v.key];if(f&&v.src){d[f]=v.src;if(v.fallback&&v.fallback!==v.src)FB[v.src]=v.fallback;}});return d;}
function stub(x){return Object.assign({},x,{audio:x.hasPastorAudio?"1":"",audio_f:x.hasAiAudio?"1":"",audio_m:""});}
function loadDay(s){return PEND[s.id]||(PEND[s.id]=fetch("data/"+s.iso+".json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).then(d=>(FULL[s.id]=adapt(d))).catch(e=>{delete PEND[s.id];throw e;}));}
function main(){
function prefetch(id){const i=VISIBLE.findIndex(x=>x.id===id);setTimeout(()=>[VISIBLE[i-1],VISIBLE[i+1]].forEach(x=>{if(x&&!FULL[x.id])loadDay(x).catch(()=>{});}),800);}
function render(id){const s=VISIBLE.find(x=>x.id===id)||VISIBLE[0];if(!s){document.getElementById("today").innerHTML='<p class="aiNote">아직 공개된 묵상이 없습니다.</p>';return;}const tok=++RTOK;
  if(FULL[s.id]){PENDING=null;renderNow(s.id);prefetch(s.id);return;}
  PENDING=s.id; /* 날짜를 읽는 동안 목소리 단추는 다시 그리지 않는다(이동이 취소되지 않게) — 고른 목소리는 새 날에 적용 */
  loadDay(s).then(()=>{if(tok!==RTOK)return;PENDING=null;renderNow(s.id);if(typeof applyRate==="function")applyRate();prefetch(s.id);},
    ()=>{if(tok!==RTOK)return;PENDING=null;document.getElementById("today").innerHTML='<p class="aiNote">이 날 묵상을 불러오지 못했습니다. 잠시 뒤 다시 열어 주세요.</p>';});}


const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
const paras=a=>a.map(t=>`<p>${fmt(t)}</p>`).join("");

/* 한국 시간 기준 오늘 날짜(YYYY-MM-DD). 날짜가 아직 안 된 묵상은 숨김 */
/* 새 묵상은 한국 시간 오전 5시부터 보인다 (자정~오전 5시에는 전날 묵상) */
var VOICE="p";try{const v=localStorage.getItem("voice");if(["p","f","m"].includes(v))VOICE=v;}catch(err){}
var VCLICK=false; /* 오너 규칙 2026-11-19: 목사님 녹음이 있으면 기본 = 목사님 음성(이 화면에서 직접 고르기 전까지) */
const OPEN_HOUR=5;
function todayKST(){
  const t=new Date(Date.now()-OPEN_HOUR*3600e3);
  try{return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).format(t);}
  catch(e){const d=new Date(t.getTime()+9*3600e3);return d.toISOString().slice(0,10);}
}
const VISIBLE=(()=>{const t=todayKST();const v=ENTRIES.filter(x=>!x.iso||x.iso<=t).sort((a,b)=>(b.iso||"").localeCompare(a.iso||""));return v;})();
function renderNow(id){
  const e=FULL[id];
  const ALL=[["p",e.audio,e.dur,"신철 목사 음성","담임목사"],["m",e.audio_m,e.dur_m,"남성 낭독","남성"],["f",e.audio_f,e.dur_f,"여성 낭독","여성"]];
  const SRC=["p","f","m"].map(k=>ALL.find(x=>x[0]===k)).filter(x=>x[1]); /* v2.0.1: 단추 순서만 바꿈 — 고른 목소리가 없는 날 기본 순서는 예전 그대로(목사→여성→남성) */
  const pick=(e.audio&&!VCLICK)?ALL[0]:(SRC.find(x=>x[0]===VOICE)||SRC[0]);
  const cur=pick?{src:pick[1],dur:pick[2]||"",kind:pick[0]}:null;
  const RL=[[0.8,"천천히"],[1,"보통"],[1.2,"조금 빠르게"],[1.5,"빠르게"]];
  const audio=cur
    ? `<div class="tts"><span class="lab">듣기</span><button type="button" class="pp" id="pp" aria-label="재생">▶</button><button type="button" class="st" id="st" aria-label="처음으로" disabled>■</button><select class="rate" id="rate" aria-label="읽는 속도">${RL.map(([r,l])=>`<option value="${r}"${r===RATE?" selected":""}>${l}</option>`).join("")}</select><span class="vsel" role="group" aria-label="목소리">${ALL.map(x=>`<button type="button" data-voice="${x[0]}" class="${pick&&x[0]===pick[0]?"on":""}" aria-pressed="${pick&&x[0]===pick[0]}"${x[1]?"":" disabled"} title="${x[3]}${x[1]?"":" · 아직 없습니다"}">${x[4]}</button>`).join("")}</span></div>
       <div class="bar"><span class="tm"><span id="cur">0:00</span> / <span id="tot">${esc(cur.dur?cur.dur.replace(/(\d+)분 (\d+)초/,(m,a,b)=>a+":"+b.padStart(2,"0")):"--:--")}</span></span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="재생 위치"></div>
       <audio id="player" preload="metadata" src="${esc(cur.src)}" data-kind="${cur.kind}" data-fb="${esc(FB[cur.src]||"")}"></audio>
       ${cur.kind!=="p"?`<p class="aiNote">${cur.kind==="f"?"여성":"남성"} AI 음성으로 읽어 드립니다</p>`:""}`
    : `<p class="aiNote">오늘 묵상 음성은 준비 중입니다.</p>`;
  document.getElementById("today").innerHTML=`
  <div class="wrap" style="padding:0">
    <div class="hero">
      <span class="date">${esc(e.date)}</span>${e.special?'<span class="special">✝ 주일 특별묵상</span>':""}
      <h1>${esc(e.title)}</h1>
      <span class="ref">${esc(e.ref)} · 신철 목사</span>
    </div>
    ${audio}
    <article>
      <section><h2>오늘의 본문</h2>
        <div class="scripture">${e.verses.map(([n,t])=>`<span class="v"><sup>${n}</sup>${esc(t)}</span>`).join("")}</div>
      </section>
      <section><h2>관찰</h2>${paras(e.observe)}</section>
      <section><h2>해석</h2>${paras(e.interpret)}
        <p class="key">${esc(e.key)}</p></section>
      ${e.image?`<figure class="pic"><img src="${esc(e.image.src)}" alt="${esc(e.image.alt||"")}" loading="lazy" width="1200" height="675">${e.image.caption?`<figcaption>${esc(e.image.caption)}</figcaption>`:""}</figure>`:""}
      <section><h2>적용</h2>${e.applies&&e.applies.length?e.applies.map((a,i)=>`<h3 class="sub"><i>적용 ${i+1}</i>${esc(a.label||"")}</h3>${paras(a.paras)}`).join(""):paras(e.apply)}</section>
      <section class="prayer"><h2>기도</h2>${paras(e.prayer)}</section>
      <section><div class="practice"><b>오늘의 실천</b>${fmt(e.practice)}</div></section>
      <section><h2>함께 드리는 기도제목</h2>
        <ol class="req">${e.requests.map(r=>`<li>${esc(r)}</li>`).join("")}</ol></section>
      <section><h2>오늘의 한 구절</h2>
        <p class="verse">“${esc(e.verse)}”<cite>${esc(e.verseRef)}</cite></p></section>
      <section class="share"><h2>오늘 묵상 나눠요</h2>
        <p>오늘 묵상을 가족과 이웃에게 보내 주세요.</p>
        ${e.share===null?'<p class="aiNote">이 날은 카카오톡 공유 카드가 없습니다.</p>':`<a class="kakao-btn" href="https://cheol0929-thejoy.github.io/saebom/kakao.html?d=${esc((e.iso||"").slice(5).replace("-",""))}" target="_blank" rel="noopener">💬 카카오톡으로 보내기</a>
        <button type="button" class="share-btn" data-title="${esc(e.title)}" data-url="https://cheol0929-thejoy.github.io/saebom/${esc((e.iso||"").slice(5).replace("-",""))}.html">🔗 링크 복사하기</button>`}
        <p class="share-msg" role="status"></p></section>
    </article>
  </div>`;
  CURRENT=e.id;
  document.title="새봄묵상 · "+e.title+" ("+e.short+")";
  renderArchive();
}

/* ── 색인: 성경 권별 · 주제별 ── */
const OT=["창세기","출애굽기","레위기","민수기","신명기","여호수아","사사기","룻기","사무엘상","사무엘하","열왕기상","열왕기하","역대상","역대하","에스라","느헤미야","에스더","욥기","시편","잠언","전도서","아가","이사야","예레미야","예레미야애가","에스겔","다니엘","호세아","요엘","아모스","오바댜","요나","미가","나훔","하박국","스바냐","학개","스가랴","말라기"];
const NT=["마태복음","마가복음","누가복음","요한복음","사도행전","로마서","고린도전서","고린도후서","갈라디아서","에베소서","빌립보서","골로새서","데살로니가전서","데살로니가후서","디모데전서","디모데후서","디도서","빌레몬서","히브리서","야고보서","베드로전서","베드로후서","요한일서","요한이서","요한삼서","유다서","요한계시록"];
const TOPICS=["하나님","예수 그리스도와 십자가","성령","말씀","기도","예배","은혜와 용서","믿음과 순종","고난과 소망","감사와 기쁨","가정","이웃 사랑과 섬김","교회 공동체","일상과 일터","죽음과 영생"];
const BYLEN=[...OT,...NT].sort((a,b)=>b.length-a.length);
const bookOf=x=>x.book||BYLEN.find(b=>(x.ref||"").startsWith(b))||"";
const chap=x=>{const m=(x.ref||"").match(/(\d+)장\s*(\d+)?/);return m?(+m[1])*1000+(+(m[2]||0)):0;};
let CURRENT="", TAB="date";
try{const t=localStorage.getItem("tab");if(["date","book","topic"].includes(t))TAB=t;}catch(err){}
const item=x=>`<li><a href="#${x.id}" aria-current="${x.id===CURRENT}"><span class="d">${esc(x.short)}</span><span class="t">${esc(x.title)}${x.ref?`<span class="r">${esc(x.ref)}</span>`:""}</span>${x.audio?'<span class="ear">🎧 음성</span>':(x.audio_f||x.audio_m)?'<span class="ear">🎧 AI</span>':""}</a></li>`;
const fold=(label,list,open)=>`<details${open?" open":""}><summary><span>${esc(label)} <span class="n">(${list.length})</span></span></summary><ul>${list.map(item).join("")}</ul></details>`;
function renderArchive(){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===TAB)));
  let h="";
  if(TAB==="date"){
    const months={};VISIBLE.forEach(x=>{const k=(x.iso||"").slice(0,7);(months[k]=months[k]||[]).push(x);});
    h=Object.keys(months).sort().reverse().map((k,i)=>{const [y,m]=k.split("-");return fold(`${y}년 ${+m}월`,months[k],i===0);}).join("");
  }else if(TAB==="book"){
    const by={};VISIBLE.forEach(x=>{const b=bookOf(x);if(b)(by[b]=by[b]||[]).push(x);});
    const part=(name,books)=>{const hit=books.filter(b=>by[b]);return `<div class="grp"><h4>${name}</h4>${hit.length?hit.map(b=>fold(b,by[b].slice().sort((p,q)=>chap(p)-chap(q)),false)).join(""):'<p class="empty">아직 묵상이 없습니다.</p>'}</div>`;};
    h=part("구약",OT)+part("신약",NT);
  }else{
    const by={};VISIBLE.forEach(x=>(x.topics||[]).forEach(t=>{(by[t]=by[t]||[]).push(x);}));
    const hit=TOPICS.filter(t=>by[t]);
    h=hit.length?hit.map(t=>fold(t,by[t],false)).join(""):'<p class="empty">아직 묵상이 없습니다.</p>';
  }
  document.getElementById("archive").innerHTML=h;
}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{TAB=b.dataset.tab;try{localStorage.setItem("tab",TAB)}catch(err){}renderArchive();}));
function route(){render(location.hash.slice(1));if(typeof applyRate==="function")applyRate();}
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0);});
/* 재생 속도·목소리: 이 기기에서만 기억 */
var RATES=[0.8,1,1.2,1.5];
var RATE=1;
var BASE=1;
try{let r=parseFloat(localStorage.getItem("rate_page"));const MIG={"0.9":0.8,"1.25":1.2,"1.75":1.5};if(MIG[r]){r=MIG[r];localStorage.setItem("rate_page",r);}if(RATES.includes(r))RATE=r;}catch(err){}
const fmtT=t=>{t=Math.max(0,Math.floor(t||0));return Math.floor(t/60)+":"+String(t%60).padStart(2,"0");};
const baseOf=a=>a&&a.dataset.kind&&a.dataset.kind!=="p"?1:BASE;
function applyRate(){const a=document.getElementById("player");if(a){a.preservesPitch=true;a.webkitPreservesPitch=true;a.mozPreservesPitch=true;a.playbackRate=RATE*baseOf(a);a.defaultPlaybackRate=RATE*baseOf(a);}
  const sel=document.getElementById("rate");if(sel)sel.value=String(RATE);
  wirePlayer();}
function wirePlayer(){
  const a=document.getElementById("player");if(!a||a.dataset.wired)return;a.dataset.wired="1";
  /* 음성: 첫 주소 실패 → 아티팩트 주소로 한 번(위치·재생 의도 유지) · 둘 다 실패 → 안내문 + 다시 시도, 재생 단추 잠금 */
  a.dataset.src0=a.getAttribute("src");a.dataset.fb0=a.dataset.fb||"";
  const dead=()=>{if(a.dataset.dead)return;a.dataset.dead="1";a.dataset.want="";[pp,st,seek].forEach(x=>{x.disabled=true;});pp.textContent="▶";pp.setAttribute("aria-label","재생");
    const m=document.createElement("p");m.className="aiNote";m.id="aerr";m.setAttribute("role","alert");m.innerHTML='음성을 불러오지 못했습니다. <button type="button" id="aretry" style="min-width:44px;min-height:44px;padding:0 14px;font:inherit;color:inherit;background:transparent;border:1px solid currentColor;border-radius:22px;cursor:pointer">다시 시도</button>';
    a.insertAdjacentElement("afterend",m);
    m.querySelector("#aretry").addEventListener("click",()=>{m.remove();delete a.dataset.dead;pp.disabled=false;seek.disabled=false;a.dataset.fb=a.dataset.fb0;a.dataset.want="1";a.setAttribute("src",a.dataset.src0);a.load();});};
  /* 재생 의도는 data-want 하나(재생·목소리 이어 듣기·다시 시도=1, 일시정지·정지·끝남·실패=빈 값), 이어 들을 위치는 data-pos.
     loadedmetadata 처리기는 하나뿐이고 그때의 의도를 읽는다 — 오류 때 잡아 둔 값이나 예전 콜백이 나중 사용자 동작을 이기지 못한다 */
  a.addEventListener("loadedmetadata",()=>{const p=parseFloat(a.dataset.pos||"0");if(p>0){try{a.currentTime=Math.min(p,a.duration||p);}catch(err){}a.dataset.pos="";}if(a.dataset.want==="1")a.play().catch(()=>{});});
  a.addEventListener("error",()=>{const fb=a.dataset.fb;if(fb&&a.getAttribute("src")!==fb){if(a.currentTime>0)a.dataset.pos=String(a.currentTime);a.dataset.fb="";a.setAttribute("src",fb);a.load();}else dead();});
  const pp=document.getElementById("pp"),st=document.getElementById("st"),seek=document.getElementById("seek"),cur=document.getElementById("cur"),tot=document.getElementById("tot");
  const upd=()=>{if(a.duration){tot.textContent=fmtT(a.duration);if(!seek.matches(":active"))seek.value=Math.round(a.currentTime/a.duration*1000);}cur.textContent=fmtT(a.currentTime);st.disabled=a.paused&&a.currentTime===0;};
  a.addEventListener("loadedmetadata",upd);a.addEventListener("timeupdate",upd);
  a.addEventListener("play",()=>{a.playbackRate=RATE*baseOf(a);pp.textContent="❚❚";pp.setAttribute("aria-label","일시정지");st.disabled=false;});
  a.addEventListener("pause",()=>{pp.textContent="▶";pp.setAttribute("aria-label","재생");upd();});
  a.addEventListener("ended",()=>{a.dataset.want="";pp.textContent="▶";pp.setAttribute("aria-label","재생");});
  pp.addEventListener("click",()=>{if(a.dataset.want==="1"||!a.paused){a.dataset.want="";a.pause();pp.textContent="▶";pp.setAttribute("aria-label","재생");}else{a.dataset.want="1";a.play().catch(()=>{});}});
  st.addEventListener("click",()=>{a.dataset.want="";a.dataset.pos="";a.pause();a.currentTime=0;upd();});
  seek.addEventListener("input",()=>{if(a.duration)a.currentTime=seek.value/1000*a.duration;});
}
document.addEventListener("change",ev=>{
  if(ev.target.id==="rate"){RATE=parseFloat(ev.target.value)||1;if(!RATES.includes(RATE))RATE=1;try{localStorage.setItem("rate_page",RATE)}catch(err){}applyRate();}
});
document.addEventListener("click",ev=>{
  const vb=ev.target.closest(".vsel button[data-voice]");
  if(vb){if(vb.disabled)return;VOICE=vb.dataset.voice;VCLICK=true;try{localStorage.setItem("voice",VOICE)}catch(err){}
    const a=document.getElementById("player");const t=a?a.currentTime:0;const was=a&&!a.paused;
    if(PENDING)return;renderNow(CURRENT);applyRate();
    const n=document.getElementById("player");if(n){if(t>0)n.dataset.pos=String(t);if(was){n.dataset.want="1";const b=document.getElementById("pp");if(b){b.textContent="❚❚";b.setAttribute("aria-label","일시정지");}}}
    return;}
  const sb=ev.target.closest(".share-btn");
  if(sb){const t=sb.dataset.url,msg=sb.parentNode.querySelector(".share-msg");
    const ok=()=>{msg.textContent="링크가 복사됐습니다. 카톡 대화창을 길게 눌러 ‘붙여넣기’ 하시면 됩니다.";};
    const fb=()=>{const ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();let done=false;try{done=document.execCommand("copy");}catch(err){}ta.remove();if(done)ok();else msg.textContent="아래 글을 길게 눌러 복사해 주세요: "+t;};
    try{navigator.clipboard.writeText(t).then(ok,fb);}catch(err){fb();}
    return;}
});
route();applyRate();

const applyFs=()=>{document.documentElement.style.setProperty("--fs",fs+"px");try{localStorage.setItem("fs",fs)}catch(e){}};
applyFs();

document.getElementById("fs-down").onclick=()=>{fs=Math.max(15,fs-2);applyFs();};
}
