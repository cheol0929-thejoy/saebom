<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5f86"/><stop offset="0.42" stop-color="#a9bcd3"/><stop offset="0.7" stop-color="#f4dcb4"/><stop offset="1" stop-color="#f8ebd0"/></linearGradient>
<radialGradient id="sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff5d2"/><stop offset="0.5" stop-color="#ffe9b0" stop-opacity="0.55"/><stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/></radialGradient>
<linearGradient id="valley" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d4660"/><stop offset="1" stop-color="#55607a"/></linearGradient>
<linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe3ea"/><stop offset="1" stop-color="#8fb7c6"/></linearGradient>
<linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fb57a"/><stop offset="1" stop-color="#6f8a55"/></linearGradient>
<linearGradient id="rock" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9c9a8"/><stop offset="1" stop-color="#a8957a"/></linearGradient>
<linearGradient id="cup" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b8874a"/><stop offset="0.5" stop-color="#e8c27a"/><stop offset="1" stop-color="#a87a40"/></linearGradient>
<linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6e4a2b"/><stop offset="0.5" stop-color="#9a6b3f"/><stop offset="1" stop-color="#6e4a2b"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff1b8" stop-opacity="0.85"/><stop offset="1" stop-color="#fff1b8" stop-opacity="0"/></radialGradient>
<linearGradient id="mist" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.6"/></linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="600" cy="300" r="300" fill="url(#sun)"/>
<g fill="#ffffff" opacity="0.35"><ellipse cx="260" cy="120" rx="150" ry="22"/><ellipse cx="330" cy="100" rx="90" ry="16"/><ellipse cx="940" cy="95" rx="170" ry="20"/></g>
