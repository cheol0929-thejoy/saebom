<g fill="#fff6cc"><circle cx="520" cy="330" r="3"/><circle cx="640" cy="318" r="2.5"/><circle cx="600" cy="300" r="3"/><circle cx="690" cy="350" r="2"/></g>
<!-- lower shade (card band) -->
<rect x="0" y="560" width="1200" height="115" fill="#4f6a3e" opacity="0.18"/>
