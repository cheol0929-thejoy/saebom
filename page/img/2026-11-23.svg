</g>
<g fill="#f6f0d8" opacity="0.9"><circle cx="210" cy="505" r="4"/><circle cx="380" cy="545" r="4"/><circle cx="1020" cy="530" r="4"/><circle cx="905" cy="470" r="3"/><circle cx="260" cy="590" r="4"/></g>
