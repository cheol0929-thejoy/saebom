    <path d="M220 430 q30 28 60 0 Z"/><path d="M920 430 q30 28 60 0 Z"/><path d="M380 446 q26 22 52 0 Z"/><path d="M780 446 q26 22 52 0 Z"/>
  </g>
  <!-- lamp -->
  <path d="M580 300 C 580 286, 620 286, 620 300 Z" fill="#9C6B3E"/><path d="M618 294 l18 -4 l-3 8 Z" fill="#9C6B3E"/>
  <path d="M634 286 C 630 274, 638 266, 640 260 C 644 268, 648 276, 640 288 Z" fill="#F6B95A"/>
  <line x1="600" y1="300" x2="600" y2="400" stroke="#7A5A3A" stroke-width="4"/>
