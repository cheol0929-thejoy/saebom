    <path d="M330 412 l40 0 l-6 30 l-28 0 Z"/><path d="M820 412 l40 0 l-6 30 l-28 0 Z"/><path d="M450 422 l34 0 l-5 26 l-24 0 Z"/><path d="M740 422 l34 0 l-5 26 l-24 0 Z"/>
  </g>
