 </radialGradient>
 <radialGradient id="flame" cx="0.5" cy="0.7" r="0.6">
  <stop offset="0" stop-color="#fffbe6"/><stop offset="0.5" stop-color="#ffd166"/><stop offset="1" stop-color="#f08a24" stop-opacity="0"/>
 </radialGradient>
